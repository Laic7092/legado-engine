name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --test online
      - run: cargo test --test download
      - run: cargo test --test sources
      - run: cargo test --test import
      - run: cargo test --test replace
      - run: cargo test --test cancel
      - run: cargo build --release --lib
      - run: make test-c
