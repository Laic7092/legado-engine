name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-x64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: macos-x64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: macos-arm64
          - target: aarch64-apple-ios
            os: macos-14
            artifact: ios-arm64
          - target: aarch64-apple-ios-sim
            os: macos-14
            artifact: ios-simulator-arm64
          - target: x86_64-apple-ios
            os: macos-14
            artifact: ios-simulator-x64
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            artifact: windows-x64
            windows_gnu: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Windows GNU toolchain
        if: matrix.windows_gnu
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Put mingw on PATH
        if: matrix.windows_gnu
        shell: bash
        run: echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build and pack
        shell: bash
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
        run: scripts/package.sh "${{ matrix.target }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: legado-engine-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
