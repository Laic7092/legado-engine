name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: linux-x64
          # Apple 目标统一用 macos-latest（arm64）：x86_64 直接在上面交叉编译，
          # 不再用已退役的 macos-13 / macos-14 标签。
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: macos-arm64
          - target: aarch64-apple-ios
            os: macos-latest
            artifact: ios-arm64
          # 只发真机切片：rquickjs-sys 的 bindgen 不认 `-ios-sim` triple，
          # 模拟器需要额外 vendor 补丁，暂不发布。
          # Windows 用 runner 自带的 MSVC：不需要 MSYS2/MinGW 和 CC 覆盖。
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rquickjs-sys 在 iOS 上没有预生成 bindings，bindgen 需要 Xcode 里的 libclang。
      - name: Point bindgen at Xcode libclang
        if: contains(matrix.target, 'ios')
        shell: bash
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Build and pack
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: legado-engine-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
