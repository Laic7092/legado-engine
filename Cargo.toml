[package]
name = "legado-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Legado (阅读3.0) book-source rules and JavaScript, behind a C ABI"
repository = "https://github.com/Laic7092/legado-engine"
readme = "README.md"
keywords = ["legado", "book-source", "quickjs", "reader"]
categories = ["parser-implementations", "api-bindings"]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
codegen-units = 1

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "blocking", "cookies"] }
aes = "0.8"
bytes = "1"
cbc = "0.1"
des = "0.8"
ecb = "0.1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
cookie_store = "0.22"
cookie = "0.18"
flate2 = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde_with = "3"
scraper = "0.20"
jsonpath_lib = "0.3"
regex = "1"
rquickjs = { version = "0.7", features = ["futures"] }
urlencoding = "2"
serde_urlencoded = "0.7"
rand = "0.8"
once_cell = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
sxd-xpath = "0.4"
sxd-document = "0.3"
quick-xml = "0.31"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
